name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip -q TmsEmpireLiveAnalyst-phase1.zip
      - run: gradle -p TmsEmpireLiveAnalyst assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tms-apk
          path: TmsEmpireLiveAnalyst/app/build/outputs/apk/debug/app-debug.apk
